:root{color-scheme:light;--ground:#eef0ea;--paper:#fafbf7;--surface:#e5e9df;--raised:#fff;--text:#273b31;--muted:#59645b;--accent:#405d45;--accent-ink:#fff;--citron:#e4ecaa;--citron-ink:#34452b;--border:#d4dbcf;--control:#8a9788;--active:#dce2d5;--positive:#2b683c;--positive-bg:#e3eddc;--negative:#9c3239;--negative-bg:#f4e4df;--focus:#52692b;--radius:16px;--ease:cubic-bezier(.23,1,.32,1);--font:'Instrument Sans',sans-serif;--serif:'Instrument Serif',Georgia,serif;--sidebar:232px;--gap:20px}
:root[data-theme=dark]{color-scheme:dark;--ground:#171917;--paper:#202420;--surface:#292e29;--raised:#303630;--text:#edf0e8;--muted:#bac3b7;--accent:#dce6c7;--accent-ink:#203021;--citron:#3b462b;--citron-ink:#e8edc0;--border:#3b443a;--control:#83927d;--active:#333d30;--positive:#bad7aa;--positive-bg:#2c3b28;--negative:#f1b0ac;--negative-bg:#3e2a2a;--focus:#d8e7ad}
*{box-sizing:border-box}html{scrollbar-color:var(--control) var(--ground);scroll-padding:24px}body{margin:0;background:var(--ground);color:var(--text);font:16px/1.5 var(--font);font-variant-numeric:tabular-nums;overflow-wrap:break-word}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}a{color:inherit;text-decoration:none}p{margin:0 0 16px}h1,h2,h3{margin:0;font-weight:600;line-height:1.2;letter-spacing:-.025em;text-wrap:balance}h1{font-size:30px}h2{font-size:19px}h3{font-size:18px}button{border:0;background:none}svg{width:20px;height:20px;flex:none}::selection{background:var(--citron);color:var(--citron-ink)}input,textarea{caret-color:var(--accent)}:focus-visible{outline:3px solid var(--focus);outline-offset:4px}#page-title:focus{outline:none}[hidden]{display:none!important}.sr-only{position:absolute!important;clip:rect(0,0,0,0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}.skip-link{position:fixed;top:12px;left:12px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:12px 20px;transform:translateY(-160%)}.skip-link:focus{transform:none}.small,small{font-size:13px;color:var(--muted)}
/* Twelve aligned columns in the canvas: 8 + 4 at the top, 8 + 4 below; 8/12 + 4/12 + gap = canvas width. */
#app{min-height:100vh}#sidebar{width:var(--sidebar);padding:32px 18px 22px 24px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;background:var(--ground);border-right:1px solid var(--border);overflow-y:auto}.brand-row{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:7px;font-size:23px;letter-spacing:-.055em;font-weight:600;white-space:nowrap}.brand-mark{width:34px;height:34px}.brand-dot{width:5px;height:5px;background:var(--accent);border-radius:100%;align-self:flex-end;margin:0 0 10px -3px}.workspace-name{color:var(--muted);font-size:13px;line-height:1.5;margin:10px 0 37px 2px}#sidebar nav{display:grid;gap:5px}.nav-item{display:flex;align-items:center;gap:12px;min-height:45px;padding:10px 12px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500}.nav-item.active{background:var(--active);color:var(--text)}.nav-item svg{width:18px;height:18px}.nav-count{margin-left:auto;font-size:13px;color:var(--muted)}.side-section{margin-top:35px}.side-label{font-size:13px;color:var(--muted);padding:0 12px;margin-bottom:12px}.subject-nav{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:13px;border-radius:8px;overflow-wrap:anywhere}.subject-marker{width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent)}.subject-marker.neutral{background:var(--control)}.side-add{font-size:13px!important;justify-content:flex-start!important;margin-top:5px}.side-add svg{width:16px;height:16px}.side-bottom{margin-top:auto;padding-top:52px}.local-note{font-size:13px;padding:22px 12px 0;color:var(--muted)}.local-note>span:last-child{display:block;margin:3px 0 0 16px;font-size:13px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:10px;vertical-align:2px}.mobile-bar,#nav-close{display:none}#nav-shade{position:fixed;inset:0;background:rgba(15,24,17,.36);border:0;z-index:35;cursor:default}

<script>const StudyCore = (() => {
  const providers = {chatgpt:['chatgpt.com','chat.openai.com'],claude:['claude.ai'],gemini:['gemini.google.com']};
  function safeURL(value, hosts) {
    try {
      const u = new URL(value);
      return u.protocol === 'https:' && !u.username && !u.password && (!hosts || hosts.includes(u.hostname)) ? u.href : '';
    } catch { return ''; }
  }
  function grade(questions, answers) {
    const correct = questions.filter(q => answers[q.id] === q.answer).length;
    return {correct,total:questions.length,unanswered:questions.filter(q => answers[q.id] == null).length,percent:questions.length ? Math.round(correct/questions.length*100) : 0};
  }
  function shuffle(items, random = Math.random) {
    const out = [...items];
    for (let i=out.length-1;i>0;i--) { const j=Math.floor(random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
    return out;
  }
  function validateBackup(j) {
    const str = (s,max=200) => typeof s==='string' && s.length>0 && s.length<=max;
    if (!j || j.app!=='StudyDesk' || ![1,2].includes(j.format) || !Array.isArray(j.subjects) || !Array.isArray(j.documents)) throw Error('Unsupported StudyDesk backup format.');
    const subjects=new Set(),documents=new Set();
    for (const s of j.subjects) {
      if (!s || !str(s.id) || !str(s.name,80)) throw Error('A subject is invalid.');
      if (subjects.has(s.id)) throw Error('Duplicate subject in backup.');
      subjects.add(s.id);
      if (s.ai != null && (typeof s.ai!=='object' || Array.isArray(s.ai))) throw Error('Invalid project links.');
      for (const [k,v] of Object.entries(s.ai||{})) if (!providers[k] || !v || !safeURL(v.url,providers[k]) || (v.label!=null && typeof v.label!=='string')) throw Error('An AI project link is invalid.');
    }
    for (const d of j.documents) {
      if (!d || !str(d.id) || !str(d.name,500) || typeof d.data!=='string' || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(d.data)) throw Error('A document in the backup is invalid.');
      if (!subjects.has(d.subjectId)) throw Error('A document has no matching subject.');
      if (documents.has(d.id)) throw Error('Duplicate document in backup.');
      documents.add(d.id);
    }
    const study=j.settings?.study;
    if (study) {
      if (typeof study!=='object' || (study.done!=null && (!Array.isArray(study.done) || study.done.some(id=>!/^\d-[1-3]$/.test(id)))) || (study.known!=null && (!Array.isArray(study.known) || study.known.some(id=>!/^\d-[1-3]-[12]$/.test(id)))) || (study.scores!=null && (!Array.isArray(study.scores) || study.scores.some(s=>!s || !Number.isFinite(s.at) || !Number.isInteger(s.total) || s.total<1 || s.total>54 || !Number.isInteger(s.correct) || s.correct<0 || s.correct>s.total || typeof s.topic!=='string')))) throw Error('Study progress in this backup is invalid.');
    }
    return j;
  }
  return {grade,shuffle,safeURL,validateBackup,providers};
})();
if (typeof module!=='undefined') module.exports=StudyCore;

// Original revision notes and practice questions; linked sources supply the full lessons.
const BOOK='https://openstax.org/books/algebra-and-trigonometry-2e/pages/';
const TOPICS=[
 {id:1,title:'Sequences & series',fullTitle:'Sequences and Series',description:'Find the pattern. Predict what comes next.',symbol:'aₙ',lessons:[
  {title:'Arithmetic sequences',minutes:6,source:'13-2-arithmetic-sequences',lead:'An arithmetic sequence adds the same number each time. That number is the common difference, d.',rule:'aₙ = a₁ + (n − 1)d',points:['Subtract consecutive terms to find d. It can be negative.','The first term has index n = 1, so there are n − 1 jumps to term n.','An explicit formula finds any term without writing the earlier terms.'],example:{q:'Find the 12th term of 7, 11, 15, 19, …',steps:['The first term is a₁ = 7. The common difference is d = 11 − 7 = 4.','Substitute n = 12 into aₙ = a₁ + (n − 1)d.','a₁₂ = 7 + (12 − 1) × 4 = 7 + 44.'],answer:'a₁₂ = 51'},watch:'Count the jumps, not the terms: term 12 is eleven jumps from term 1.',cards:[['How do you find an arithmetic common difference?','Subtract a term from the next one: d = aₙ₊₁ − aₙ.'],['What is the nth-term formula for an arithmetic sequence?','aₙ = a₁ + (n − 1)d.']],questions:[{q:'What is the 10th term of 4, 7, 10, 13, …?',choices:['27','30','31','34'],answer:2,why:'d = 3, so a₁₀ = 4 + 9 × 3 = 31.'},{q:'Find the common difference of 20, 15, 10, 5, …',choices:['5','−5','−10','15'],answer:1,why:'Subtract consecutive terms: 15 − 20 = −5.'}]},
  {title:'Geometric sequences',minutes:6,source:'13-3-geometric-sequences',lead:'A geometric sequence multiplies by a fixed common ratio, r, each time.',rule:'aₙ = a₁rⁿ⁻¹',points:['For nonzero consecutive terms, divide the next term by the current one to find r.','A negative ratio makes the signs alternate.','When 0 < r < 1, positive terms get smaller.'],example:{q:'Find the 6th term of 3, 6, 12, 24, …',steps:['a₁ = 3 and r = 6 ÷ 3 = 2.','a₆ = 3 × 2⁶⁻¹ = 3 × 2⁵.','2⁵ = 32, so multiply 3 by 32.'],answer:'a₆ = 96'},watch:'The exponent is n − 1. Raising r to n moves one term too far.',cards:[['What stays constant in a geometric sequence?','The common ratio r: each term is multiplied by r.'],['What is the nth-term formula for a geometric sequence?','aₙ = a₁rⁿ⁻¹.']],questions:[{q:'What comes next: 81, 27, 9, …?',choices:['6','3','1','0'],answer:1,why:'The common ratio is 1/3. Multiply 9 by 1/3 to get 3.'},{q:'Find the 5th term when a₁ = 2 and r = −3.',choices:['−162','−54','54','162'],answer:3,why:'a₅ = 2(−3)⁴ = 2 × 81 = 162.'}]},
  {title:'Adding a series',minutes:8,source:'13-4-series-and-their-notations',lead:'A sequence lists terms. A series adds them. The right sum formula saves a lot of arithmetic.',rule:'Sₙ = n(a₁ + aₙ)/2',points:['For an arithmetic series, multiply the number of terms by the average of the first and last.','For a geometric series with r ≠ 1, Sₙ = a₁(1 − rⁿ)/(1 − r). If r = 1, Sₙ = na₁.','An infinite geometric series has sum a₁/(1 − r) only when |r| < 1.'],example:{q:'Add 5 + 9 + 13 + … + 41.',steps:['Find the number of terms: 41 = 5 + (n − 1)4, so n = 10.','Use the arithmetic series formula.','S₁₀ = 10(5 + 41)/2 = 5 × 46.'],answer:'S₁₀ = 230'},watch:'Use the geometric sum formula only for a geometric series. Check the pattern first.',cards:[['How do you add an arithmetic series?','Sₙ = n(a₁ + aₙ)/2.'],['When does an infinite geometric series have a finite sum?','Only when |r| < 1. Its sum is a₁/(1 − r).']],questions:[{q:'Find the sum 2 + 4 + 6 + … + 20.',choices:['100','110','120','220'],answer:1,why:'There are 10 terms. S = 10(2 + 20)/2 = 110.'},{q:'Find 8 + 4 + 2 + 1 + … continued forever.',choices:['8','12','16','No finite sum'],answer:2,why:'r = 1/2, so the infinite sum is 8/(1 − 1/2) = 16.'}]}
 ]},
 {id:2,title:'Trigonometry',fullTitle:'Trigonometry',description:'Connect angles, sides, and triangles.',symbol:'sin θ',lessons:[
  {title:'Right-triangle ratios',minutes:7,source:'7-2-right-triangle-trigonometry',lead:'Choose a reference angle, then name its opposite side, adjacent side, and the hypotenuse.',rule:'sin θ = opposite / hypotenuse',points:['SOH–CAH–TOA: sine uses opposite/hypotenuse, cosine uses adjacent/hypotenuse, tangent uses opposite/adjacent.','The hypotenuse is always opposite the right angle.','Use inverse trig to find an angle. Use degree mode for these triangle problems.'],example:{q:'A right triangle has opposite side 6 and hypotenuse 10. Find θ.',steps:['sin θ = 6/10 = 0.6.','θ = sin⁻¹(0.6). Set the calculator to degrees.','Round only after calculating the angle.'],answer:'θ ≈ 36.9°'},watch:'sin⁻¹ finds an angle; it does not mean 1/sin.',cards:[['What does SOH–CAH–TOA mean?','sin = opposite/hypotenuse; cos = adjacent/hypotenuse; tan = opposite/adjacent.'],['Which calculator setting is used for angles measured in degrees?','Degree mode. Check the mode before using trig or inverse trig.']],questions:[{q:'If opposite = 3 and hypotenuse = 5, what is sin θ?',choices:['3/5','4/5','3/4','5/3'],answer:0,why:'Sine is opposite divided by hypotenuse: 3/5.'},{q:'If tan θ = 1 and θ is acute, find θ.',choices:['30°','45°','60°','90°'],answer:1,why:'An acute angle with equal opposite and adjacent sides is 45°.'}]},
  {title:'Angles & the unit circle',minutes:8,source:'7-3-unit-circle',lead:'On a circle of radius 1, the point at angle θ is (cos θ, sin θ). The quadrant determines each sign.',rule:'(x, y) = (cos θ, sin θ)',points:['Angles in standard position start on the positive x-axis and turn counterclockwise when positive.','Sine is positive in quadrants I and II; cosine is positive in I and IV.','Use the acute reference angle to find the size of a trig value, then apply the quadrant sign.'],example:{q:'Find the exact value of sin 150°.',steps:['150° lies in quadrant II, where sine is positive.','Its reference angle is 180° − 150° = 30°.','sin 150° = sin 30°.'],answer:'sin 150° = 1/2'},watch:'The reference angle is acute. It is not always the original angle minus 180°.',cards:[['Which coordinate on the unit circle is sine?','The y-coordinate. A point on the unit circle is (cos θ, sin θ).'],['Where is cosine negative?','Quadrants II and III, where the x-coordinate is negative.']],questions:[{q:'Find cos 180°.',choices:['1','0','−1','1/2'],answer:2,why:'The unit-circle point is (−1, 0), so cosine is −1.'},{q:'Which quadrant has negative sine and positive cosine?',choices:['I','II','III','IV'],answer:3,why:'In quadrant IV, y is negative and x is positive.'}]},
  {title:'Sine & cosine laws',minutes:9,source:'10-2-non-right-triangles-law-of-cosines',lead:'For triangles without a right angle, use the sine law with a known opposite pair, or the cosine law with SAS or SSS.',rule:'c² = a² + b² − 2ab cos C',points:['Sine law: a/sin A = b/sin B = c/sin C. Each side is paired with its opposite angle.','Cosine law works when you know two sides and their included angle, or all three sides.','An SSA sine-law problem may have two valid triangles. Check whether a second angle fits the 180° total.'],example:{q:'Two sides are 5 and 7 with an included angle of 60°. Find the third side.',steps:['c² = 5² + 7² − 2(5)(7) cos 60°.','Since cos 60° = 1/2, c² = 25 + 49 − 35 = 39.','Take the positive square root because a length is positive.'],answer:'c = √39 ≈ 6.24'},watch:'In the cosine law, C must be the angle between sides a and b.',cards:[['When is the cosine law useful?','SAS (two sides and the included angle) or SSS (all three sides).'],['What is the sine law?','a/sin A = b/sin B = c/sin C, with each angle opposite its side.']],questions:[{q:'If a = 10, A = 30°, and B = 90°, find b.',choices:['5','10','15','20'],answer:3,why:'b = 10 sin 90° / sin 30° = 10/(1/2) = 20.'},{q:'Sides 3 and 4 meet at 90°. What is the third side?',choices:['1','5','7','25'],answer:1,why:'c² = 9 + 16 − 24 cos 90° = 25, so c = 5.'}]}
 ]},
 {id:3,title:'Quadratic functions',fullTitle:'Quadratic Functions',description:'Read a parabola and make it your own.',symbol:'x²',lessons:[
  {title:'Vertex form & transformations',minutes:7,source:'5-1-quadratic-functions',lead:'Vertex form makes a parabola’s turning point visible. The coefficient a controls its direction and stretch.',rule:'y = a(x − h)² + k',points:['The vertex is (h, k), and the axis of symmetry is x = h.','a > 0 opens upward; a < 0 opens downward. |a| > 1 makes the parabola narrower.','The sign inside the brackets is reversed: (x + 3)² has h = −3.'],example:{q:'Describe y = −2(x − 3)² + 5.',steps:['Read h = 3 and k = 5: the vertex is (3, 5).','a = −2, so the parabola opens down and is vertically stretched by factor 2.','The vertex is a maximum. Symmetry is about x = 3.'],answer:'Vertex (3, 5); maximum y = 5'},watch:'The vertex is (3, 5), not (−3, 5). Read x − h carefully.',cards:[['What is the vertex of y = a(x − h)² + k?','(h, k). The axis of symmetry is x = h.'],['What does a negative a do to a parabola?','It opens downward; its vertex gives a maximum.']],questions:[{q:'Find the vertex of y = 2(x + 4)² − 1.',choices:['(4, −1)','(−4, −1)','(−4, 1)','(2, −1)'],answer:1,why:'x + 4 is x − (−4), so h = −4 and k = −1.'},{q:'Which parabola opens downward?',choices:['y = x²','y = 2x² + 1','y = −x² + 3','y = (x − 2)²'],answer:2,why:'Its x² coefficient is negative.'}]},
  {title:'Standard & factored forms',minutes:8,source:'5-1-quadratic-functions',lead:'Different forms reveal different features. Standard form shows the y-intercept; factored form shows the roots.',rule:'y = a(x − r₁)(x − r₂)',points:['Standard form is y = ax² + bx + c. The y-intercept is (0, c).','In factored form the zeros are r₁ and r₂. They are the x-intercepts when real.','The axis of symmetry is halfway between two real roots: x = (r₁ + r₂)/2. In standard form, x = −b/(2a).'],example:{q:'Find the intercepts and vertex of y = (x − 1)(x − 5).',steps:['The x-intercepts are (1, 0) and (5, 0).','The axis is x = (1 + 5)/2 = 3. Substitute x = 3: y = 2(−2) = −4.','At x = 0, y = (−1)(−5) = 5.'],answer:'Vertex (3, −4); y-intercept (0, 5)'},watch:'The roots give x-intercepts. They are not the vertex coordinates.',cards:[['What does c tell you in y = ax² + bx + c?','The y-intercept is (0, c).'],['What is the axis of symmetry in standard form?','x = −b/(2a), for a ≠ 0.']],questions:[{q:'Find the zeros of y = (x + 2)(x − 6).',choices:['2 and 6','−2 and 6','2 and −6','−2 and −6'],answer:1,why:'Set each factor to zero: x + 2 = 0 or x − 6 = 0.'},{q:'Find the y-intercept of y = 3x² − 7x + 4.',choices:['(0, 3)','(0, −7)','(4, 0)','(0, 4)'],answer:3,why:'Set x = 0: y = 4.'}]},
  {title:'Domain, range & applications',minutes:7,source:'5-1-quadratic-functions',lead:'The domain lists permitted inputs. The range lists possible outputs. A parabola’s vertex sets its output limit.',rule:'a > 0: y ≥ k; a < 0: y ≤ k',points:['A quadratic with no context restrictions has all real x-values as its domain.','An upward parabola has a minimum at its vertex; a downward parabola has a maximum.','A word problem can restrict the domain: time and physical lengths often cannot be negative.'],example:{q:'A ball’s height is h(t) = −5(t − 2)² + 20. What is its maximum height?',steps:['The coefficient −5 is negative, so the vertex is a maximum.','The vertex is (2, 20): at t = 2 seconds the height is 20 metres.','For the flight from launch to landing, 0 ≤ t ≤ 4 and 0 ≤ h ≤ 20.'],answer:'Maximum height: 20 m at 2 s'},watch:'Use the context’s domain. Negative time may be valid algebra but outside the physical situation.',cards:[['What is the range of y = (x − 2)² + 3 for real x?','y ≥ 3, because the minimum value at the vertex is 3.'],['What is the unrestricted domain of a quadratic function?','All real numbers. A context can impose a smaller domain.']],questions:[{q:'Find the range of y = −(x − 1)² + 9 for real x.',choices:['y ≥ 9','y ≤ 9','y ≤ 1','All real y'],answer:1,why:'The parabola opens down and reaches a maximum of 9.'},{q:'For y = 2(x + 1)² − 8, what is the minimum y-value?',choices:['−8','−1','1','8'],answer:0,why:'The upward parabola reaches its minimum at (−1, −8).'}]}
 ]},
 {id:4,title:'Quadratic equations',fullTitle:'Quadratic Equations',description:'Find the roots, then check your reasoning.',symbol:'= 0',lessons:[
  {title:'Solving by factoring',minutes:6,source:'2-5-quadratic-equations',lead:'A product equals zero only when at least one factor is zero. First move every term to one side.',rule:'AB = 0 ⇒ A = 0 or B = 0',points:['Write the equation in the form ax² + bx + c = 0.','Factor out any common factor, then factor the remaining expression.','Set every factor equal to zero and check the proposed solutions.'],example:{q:'Solve x² − 7x + 12 = 0.',steps:['Two numbers multiply to 12 and add to −7: −3 and −4.','Factor: (x − 3)(x − 4) = 0.','Set x − 3 = 0 or x − 4 = 0.'],answer:'x = 3 or x = 4'},watch:'The zero-product rule needs zero on one side. It does not apply directly to (x − 3)(x − 4) = 6.',cards:[['What must be on one side before using the zero-product rule?','Zero. Then set each factor on the other side equal to zero.'],['Why should you avoid dividing x² = 5x by x?','You would lose the solution x = 0. Factor x(x − 5) = 0 instead.']],questions:[{q:'Solve x² − 9 = 0.',choices:['x = 3 only','x = −3 only','x = −3 or 3','x = 9'],answer:2,why:'(x − 3)(x + 3) = 0 gives x = 3 or −3.'},{q:'Solve x² + 5x = 0.',choices:['x = −5 only','x = 0 or −5','x = 0 or 5','x = 5 only'],answer:1,why:'Factor x(x + 5) = 0, so x = 0 or −5.'}]},
  {title:'Completing the square',minutes:8,source:'2-5-quadratic-equations',lead:'Create a perfect-square trinomial by adding the square of half the x-coefficient.',rule:'x² + bx + (b/2)² = (x + b/2)²',points:['If the x² coefficient is not 1, divide the whole equation by it first.','Add the same amount to both sides of an equation.','When taking square roots, include both the positive and negative roots.'],example:{q:'Solve x² + 6x − 7 = 0.',steps:['Move the constant: x² + 6x = 7.','Half of 6 is 3; add 9 to both sides: (x + 3)² = 16.','x + 3 = ±4, so x = −3 ± 4.'],answer:'x = 1 or x = −7'},watch:'Adding 9 to the left means adding 9 to the right too.',cards:[['What number completes the square for x² + bx?','(b/2)².'],['What follows from (x − h)² = k when k ≥ 0?','x − h = ±√k, so x = h ± √k.']],questions:[{q:'What completes x² + 8x + ___ into a perfect square?',choices:['4','8','16','64'],answer:2,why:'Half of 8 is 4; its square is 16.'},{q:'Solve (x − 2)² = 9.',choices:['x = 5 only','x = −1 only','x = −5 or 1','x = −1 or 5'],answer:3,why:'x − 2 = ±3, so x = 2 ± 3.'}]},
  {title:'Formula & discriminant',minutes:8,source:'2-5-quadratic-equations',lead:'The quadratic formula works even when factoring is difficult. The discriminant predicts the number of real solutions.',rule:'x = (−b ± √(b² − 4ac)) / (2a)',points:['Read a, b, and c from ax² + bx + c = 0. Keep their signs.','If D = b² − 4ac is positive, there are two distinct real roots; if zero, one repeated real root.','If D < 0, there are no real roots. Nonreal roots are outside these revision notes.'],example:{q:'Solve 2x² + 3x − 2 = 0.',steps:['a = 2, b = 3, c = −2. D = 9 − 4(2)(−2) = 25.','x = (−3 ± √25)/4 = (−3 ± 5)/4.','Evaluate each sign: 2/4 and −8/4.'],answer:'x = 1/2 or x = −2'},watch:'The denominator 2a divides the entire numerator, not only the square root.',cards:[['What is the discriminant?','D = b² − 4ac. It determines the number of real roots.'],['What does a zero discriminant mean?','Exactly one distinct real solution, a repeated root.']],questions:[{q:'How many real solutions does x² + 2x + 5 = 0 have?',choices:['0','1','2','5'],answer:0,why:'D = 2² − 4(1)(5) = −16, so there are no real solutions.'},{q:'What is the discriminant of x² − 6x + 9 = 0?',choices:['−36','0','18','72'],answer:1,why:'D = (−6)² − 4(1)(9) = 36 − 36 = 0.'}]}
 ]},
 {id:5,title:'Radicals',fullTitle:'Radical Expressions and Equations',description:'Simplify roots without losing the conditions.',symbol:'√x',lessons:[
  {title:'Simplifying radicals',minutes:6,source:'1-3-radicals-and-rational-exponents',lead:'Look for a perfect-square factor inside a square root. Bring its square root outside.',rule:'√(ab) = √a · √b  (a, b ≥ 0)',points:['For example, √72 = √(36 × 2) = 6√2.','For real square roots, the radicand must be nonnegative.','√(x²) = |x| for real x. It equals x only if x ≥ 0.'],example:{q:'Simplify √200.',steps:['Find a perfect-square factor: 200 = 100 × 2.','Separate the factors: √200 = √100 × √2.','√100 = 10. The remaining factor 2 has no square factor greater than 1.'],answer:'√200 = 10√2'},watch:'√(a + b) is not generally √a + √b.',cards:[['What is √(x²) for real x?','|x|, because the principal square root is nonnegative.'],['How do you simplify √72?','√(36 × 2) = 6√2.']],questions:[{q:'Simplify √48.',choices:['4√3','3√4','8√6','16√3'],answer:0,why:'48 = 16 × 3, so √48 = 4√3.'},{q:'Evaluate √((−7)²).',choices:['−7','7','49','±7'],answer:1,why:'The principal square root of 49 is 7.'}]},
  {title:'Operations with radicals',minutes:7,source:'1-3-radicals-and-rational-exponents',lead:'Combine like radicals after simplifying. Multiply radicals using ordinary distribution.',rule:'a√m + b√m = (a + b)√m',points:['Only radicals with the same index and radicand combine by addition.','Multiply coefficients and radicands, then simplify.','To rationalize a single square-root denominator, multiply top and bottom by that square root.'],example:{q:'Simplify 2√12 + √27.',steps:['Simplify √12 = 2√3, so 2√12 = 4√3.','Simplify √27 = 3√3.','Combine like radicals: 4√3 + 3√3.'],answer:'7√3'},watch:'√2 + √3 cannot be combined into √5.',cards:[['When can you add two radical terms into one term?','When they have the same root index and radicand, after simplifying.'],['How do you rationalize 1/√3?','Multiply by √3/√3 to get √3/3.']],questions:[{q:'Simplify 3√5 + 2√5.',choices:['5√10','6√5','5√5','√25'],answer:2,why:'The radicals match, so add the coefficients: (3 + 2)√5.'},{q:'Simplify √6 × √24.',choices:['√30','12','6','24'],answer:1,why:'√6 × √24 = √144 = 12.'}]},
  {title:'Solving radical equations',minutes:8,source:'2-6-other-types-of-equations',lead:'Isolate the radical, raise both sides to remove it, then check every candidate in the original equation.',rule:'Isolate → square → solve → check',points:['A square root is nonnegative, so first consider whether the other side can be nonnegative.','Squaring can introduce solutions that do not satisfy the original equation.','Check in the original equation, not only in the squared equation.'],example:{q:'Solve √(x + 6) = x.',steps:['The right side must be nonnegative: x ≥ 0.','Square: x + 6 = x². Factor x² − x − 6 = (x − 3)(x + 2) = 0.','Candidates are 3 and −2. Check: √9 = 3, but √4 = 2 ≠ −2.'],answer:'x = 3; reject x = −2'},watch:'An algebraic candidate can be extraneous. Never skip the final check.',cards:[['Why check solutions after squaring an equation?','Squaring can introduce extraneous solutions.'],['Can √(x + 1) = −3 have a real solution?','No. A principal square root cannot be negative.']],questions:[{q:'Solve √(x + 5) = 4.',choices:['x = 9','x = 11','x = 16','x = 21'],answer:1,why:'x + 5 = 16, so x = 11. Check: √16 = 4.'},{q:'How many real solutions does √(x − 1) = −2 have?',choices:['0','1','2','4'],answer:0,why:'The left side is nonnegative; it cannot equal −2.'}]}
 ]},
 {id:6,title:'Rational expressions',fullTitle:'Rational Expressions and Equations',description:'Work with fractions that contain variables.',symbol:'1/x',lessons:[
  {title:'Simplify & find restrictions',minutes:7,source:'1-6-rational-expressions',lead:'A rational expression is a fraction of polynomials. Its denominator can never be zero.',rule:'Factor first. Cancel common factors.',points:['Find excluded values from the original denominator.','Cancel factors that multiply the entire numerator and denominator, not individual terms in a sum.','Keep original restrictions even when a factor cancels.'],example:{q:'Simplify (x² − 9)/(x − 3).',steps:['The original denominator requires x ≠ 3.','Factor the numerator: (x − 3)(x + 3)/(x − 3).','Cancel the common nonzero factor x − 3.'],answer:'x + 3, with x ≠ 3'},watch:'The simplified expression still excludes x = 3. Cancellation does not fill the original hole.',cards:[['Where do restrictions come from?','Values that make any original denominator zero are excluded.'],['Can you cancel x in (x + 2)/x?','No. x is a term of the sum, not a factor of the whole numerator.']],questions:[{q:'Simplify (x² − 4)/(x − 2), with x ≠ 2.',choices:['x − 2','x + 2','x² + 2','2x'],answer:1,why:'Factor the numerator as (x − 2)(x + 2), then cancel x − 2.'},{q:'What value is excluded from 3/(x + 5)?',choices:['0','3','5','−5'],answer:3,why:'x + 5 = 0 when x = −5.'}]},
  {title:'Multiply, divide & add',minutes:8,source:'1-6-rational-expressions',lead:'Use fraction rules with factored polynomials. For addition, build a common denominator first.',rule:'a/b + c/d = (ad + bc)/(bd)',points:['For multiplication, factor and cancel common factors before expanding.','For division, multiply by the reciprocal. The original divisor must also be nonzero.','For addition or subtraction, use a common denominator and combine the full numerators.'],example:{q:'Add 1/x + 1/(x + 1).',steps:['The common denominator is x(x + 1), with x ≠ 0, −1.','Rewrite the numerators: (x + 1)/[x(x + 1)] + x/[x(x + 1)].','Combine: (x + 1 + x)/[x(x + 1)].'],answer:'(2x + 1)/[x(x + 1)], x ≠ 0, −1'},watch:'Adding fractions does not mean adding their denominators.',cards:[['What is the first step when adding rational expressions?','Find a common denominator, then rewrite each numerator.'],['How do you divide by a fraction?','Multiply by its reciprocal, keeping the original restrictions and excluding a zero divisor.']],questions:[{q:'Simplify 2/x + 3/x, where x ≠ 0.',choices:['5/(2x)','6/x','5/x','5/x²'],answer:2,why:'The denominators match, so add the numerators: (2 + 3)/x.'},{q:'Simplify (x/3) ÷ (2x/9), where x ≠ 0.',choices:['2/3','3/2','2x²/27','x/2'],answer:1,why:'Multiply by the reciprocal: (x/3)(9/2x) = 3/2.'}]},
  {title:'Solving rational equations',minutes:8,source:'2-6-other-types-of-equations',lead:'List excluded values, multiply the equation by the least common denominator, solve, and check.',rule:'Restrictions → common denominator → solve',points:['Multiplying every term by the least common denominator clears the fractions.','Every term on both sides must be multiplied.','A candidate equal to an excluded value is never a solution.'],example:{q:'Solve 2/x + 1 = 5/x.',steps:['The denominator requires x ≠ 0.','Multiply all terms by x: 2 + x = 5.','Solve x = 3. Check: 2/3 + 1 = 5/3.'],answer:'x = 3'},watch:'Do not accept a solution that makes an original denominator zero.',cards:[['What clears fractions in a rational equation?','Multiply every term on both sides by the least common denominator.'],['When must a rational-equation candidate be rejected?','If it makes an original denominator zero or fails the original equation.']],questions:[{q:'Solve 6/x = 2, where x ≠ 0.',choices:['x = 2','x = 3','x = 4','x = 12'],answer:1,why:'Multiply by x: 6 = 2x, so x = 3.'},{q:'Solve (x + 1)/(x − 1) = 2.',choices:['x = 1','x = −1','x = 2','x = 3'],answer:3,why:'x + 1 = 2(x − 1), so x = 3. It is not the excluded value 1.'}]}
 ]},
 {id:7,title:'Absolute value & reciprocals',fullTitle:'Absolute Value and Reciprocal Functions',description:'Explore distance, reflections, and asymptotes.',symbol:'|x|',lessons:[
  {title:'Absolute-value functions',minutes:6,source:'3-6-absolute-value-functions',lead:'Absolute value measures distance from zero. Its graph has two straight branches meeting at a vertex.',rule:'y = a|x − h| + k',points:['The vertex is (h, k). The graph is V-shaped when a > 0 and inverted when a < 0.','For a > 0, the minimum y-value is k; the domain is all real x.','|u| equals u when u ≥ 0 and −u when u < 0.'],example:{q:'Find the vertex and range of y = 2|x − 3| − 4.',steps:['Read h = 3 and k = −4.','a = 2 is positive, so the graph opens upward.','Its lowest output is −4 at x = 3.'],answer:'Vertex (3, −4); range y ≥ −4'},watch:'Absolute value returns a nonnegative number before a and k are applied. The final function value can be negative.',cards:[['What does |x| measure?','The nonnegative distance from x to zero.'],['What is the vertex of y = a|x − h| + k?','(h, k).']],questions:[{q:'Evaluate |−8|.',choices:['−8','0','8','±8'],answer:2,why:'−8 is 8 units from zero.'},{q:'Find the vertex of y = |x + 2| + 1.',choices:['(2, 1)','(−2, 1)','(−2, −1)','(1, 2)'],answer:1,why:'x + 2 = x − (−2), so h = −2 and k = 1.'}]},
  {title:'Absolute-value equations',minutes:7,source:'2-7-linear-inequalities-and-absolute-value-inequalities',lead:'A positive distance can occur on either side of zero. Split an absolute-value equation into two cases.',rule:'|u| = k ⇒ u = k or u = −k  (k ≥ 0)',points:['Isolate the absolute-value expression first.','When k > 0, solve the positive and negative cases. When k = 0, solve u = 0.','When k < 0, there are no real solutions.'],example:{q:'Solve |2x − 1| = 5.',steps:['Case one: 2x − 1 = 5, so 2x = 6 and x = 3.','Case two: 2x − 1 = −5, so 2x = −4 and x = −2.','Check both in the original equation.'],answer:'x = 3 or x = −2'},watch:'Use both cases after isolating the absolute value.',cards:[['How do you solve |u| = 5?','Solve u = 5 and u = −5.'],['How many real solutions can |u| = −2 have?','None: absolute value is nonnegative.']],questions:[{q:'Solve |x − 4| = 2.',choices:['x = 2 or 6','x = −2 or 2','x = 4 only','x = −6 or 6'],answer:0,why:'x − 4 = ±2 gives x = 4 ± 2.'},{q:'Solve |3x| = 0.',choices:['x = 3','x = −3','x = 0','No solution'],answer:2,why:'Only 3x = 0 makes the absolute value zero.'}]},
  {title:'Reciprocal functions',minutes:8,source:'5-6-rational-functions',lead:'A reciprocal turns a nonzero number into its multiplicative inverse. Its graph has values it approaches but may never reach.',rule:'y = a/(x − h) + k  (a ≠ 0)',points:['The vertical asymptote is x = h; the horizontal asymptote is y = k.','The domain excludes h and the range excludes k.','For y = 1/f(x), zeros of f are excluded. A zero gives a vertical asymptote when no cancellation removes it.'],example:{q:'State the asymptotes of y = 2/(x − 3) + 1.',steps:['The denominator is zero at x = 3: this is the vertical asymptote.','As x grows in magnitude, 2/(x − 3) approaches zero.','The whole function therefore approaches y = 1.'],answer:'Vertical: x = 3; horizontal: y = 1'},watch:'A horizontal asymptote describes end behavior. Rational functions in general can cross one.',cards:[['What values are excluded from y = 1/x?','x = 0 from the domain and y = 0 from the range.'],['What are the asymptotes of y = a/(x − h) + k, a ≠ 0?','Vertical x = h and horizontal y = k.']],questions:[{q:'What is the vertical asymptote of y = 1/(x + 4)?',choices:['x = 4','x = −4','y = 4','y = −4'],answer:1,why:'The denominator is zero when x = −4.'},{q:'For y = 3/x, what is y when x = −2?',choices:['−6','−2/3','−3/2','3/2'],answer:2,why:'Substitute x = −2: y = 3/(−2) = −3/2.'}]}
 ]},
 {id:8,title:'Systems of equations',fullTitle:'Systems of Equations',description:'Find the point where the conditions agree.',symbol:'x, y',lessons:[
  {title:'Solving by substitution',minutes:7,source:'11-1-systems-of-linear-equations-two-variables',lead:'A solution to a system satisfies every equation at once. Replace one variable with an equivalent expression.',rule:'Solve one variable. Substitute into the other equation.',points:['Choose an equation where a variable is easy to isolate.','Substitute the whole expression, using brackets where needed.','After finding one variable, substitute back to find the other. Check both equations.'],example:{q:'Solve y = 2x + 1 and x + y = 10.',steps:['Replace y in the second equation: x + (2x + 1) = 10.','3x + 1 = 10, so x = 3.','Use y = 2(3) + 1 = 7. Check 3 + 7 = 10.'],answer:'(x, y) = (3, 7)'},watch:'A solution is an ordered pair. Finding only x is not the full answer.',cards:[['What does a system’s solution satisfy?','Every equation in the system at the same time.'],['When is substitution especially convenient?','When one equation already isolates a variable or has a coefficient of 1 or −1.']],questions:[{q:'Solve y = x + 2 and x + y = 8.',choices:['(2, 6)','(3, 5)','(4, 4)','(5, 3)'],answer:1,why:'x + x + 2 = 8 gives x = 3, then y = 5.'},{q:'Does (2, 3) solve both x + y = 5 and 2x − y = 1?',choices:['Yes','Only the first','Only the second','Neither'],answer:0,why:'2 + 3 = 5 and 2(2) − 3 = 1. Both equations hold.'}]},
  {title:'Elimination & number of solutions',minutes:8,source:'11-1-systems-of-linear-equations-two-variables',lead:'Add or subtract equations to eliminate a variable. The resulting statement also tells you if a system has no solution or infinitely many.',rule:'Equal and opposite coefficients cancel.',points:['Multiply an entire equation, on both sides, to create opposite coefficients.','A false statement such as 0 = 4 means no solution.','An identity such as 0 = 0 means the two linear equations describe the same line, giving infinitely many solutions.'],example:{q:'Solve 2x + y = 9 and x − y = 3.',steps:['Add the equations: (2x + y) + (x − y) = 9 + 3.','3x = 12, so x = 4.','Substitute into x − y = 3: 4 − y = 3, so y = 1.'],answer:'(x, y) = (4, 1)'},watch:'When multiplying an equation, multiply every term and its right-hand side.',cards:[['What does 0 = 5 mean after eliminating a variable?','No solution: the equations contradict one another.'],['What does 0 = 0 mean for two equivalent linear equations?','They describe the same line and have infinitely many solutions.']],questions:[{q:'Solve x + y = 7 and x − y = 1.',choices:['(3, 4)','(4, 3)','(6, 1)','(7, 0)'],answer:1,why:'Adding gives 2x = 8, so x = 4 and y = 3.'},{q:'How many solutions do y = 2x + 1 and y = 2x + 4 have?',choices:['0','1','2','Infinitely many'],answer:0,why:'The lines have the same slope and different intercepts, so they are parallel.'}]},
  {title:'Linear–quadratic systems',minutes:9,source:'11-3-systems-of-nonlinear-equations-and-inequalities-two-variables',lead:'A line and a parabola can meet at zero, one, or two points. Set their expressions for y equal, then solve the quadratic.',rule:'Same y ⇒ set the expressions equal.',points:['Substitution reduces the system to a quadratic equation in one variable.','Each real x-value produces a corresponding y-value.','Check every ordered pair in both original equations.'],example:{q:'Solve y = x² and y = x + 2.',steps:['Set x² = x + 2. Move everything left: x² − x − 2 = 0.','Factor: (x − 2)(x + 1) = 0, so x = 2 or x = −1.','Use y = x²: y = 4 or y = 1, respectively.'],answer:'(2, 4) and (−1, 1)'},watch:'Keep each y-value paired with the x-value that produced it.',cards:[['How many intersections can a line and a parabola have?','Zero, one, or two real intersection points.'],['How do you solve y = f(x) and y = g(x)?','Solve f(x) = g(x), then find y for each real x and check both equations.']],questions:[{q:'Where do y = x² and y = 4 meet?',choices:['(4, 4) only','(2, 4) only','(−2, 4) and (2, 4)','(−4, 4) and (4, 4)'],answer:2,why:'x² = 4 gives x = −2 or 2; both have y = 4.'},{q:'How many real intersections do y = x² and y = −1 have?',choices:['0','1','2','Infinitely many'],answer:0,why:'x² cannot be negative for real x.'}]}
 ]},
 {id:9,title:'Inequalities',fullTitle:'Linear and Quadratic Inequalities',description:'Find a whole set of answers, not just one.',symbol:'≤',lessons:[
  {title:'Linear inequalities',minutes:6,source:'2-7-linear-inequalities-and-absolute-value-inequalities',lead:'Solve an inequality much like an equation, with one critical rule: reverse the sign when multiplying or dividing by a negative.',rule:'−2x < 6 ⇒ x > −3',points:['Adding or subtracting the same number preserves the inequality direction.','Multiplying or dividing by a negative reverses it.','An open number-line point excludes an endpoint; a filled point includes it.'],example:{q:'Solve 5 − 3x ≥ 14.',steps:['Subtract 5: −3x ≥ 9.','Divide by −3 and reverse ≥ to ≤.','Check a value such as x = −4: 5 + 12 = 17 ≥ 14.'],answer:'x ≤ −3'},watch:'The sign reversal applies when multiplying or dividing by a negative, not when subtracting one.',cards:[['When must you reverse an inequality sign?','When multiplying or dividing both sides by a negative number.'],['What does a filled point mean on a number line?','The endpoint is included, as with ≤ or ≥.']],questions:[{q:'Solve −2x > 8.',choices:['x > −4','x < −4','x > 4','x < 4'],answer:1,why:'Divide by −2 and reverse the sign: x < −4.'},{q:'Solve x + 3 ≤ 7.',choices:['x ≤ 4','x ≥ 4','x < 10','x ≤ 10'],answer:0,why:'Subtract 3 from both sides: x ≤ 4.'}]},
  {title:'Quadratic sign intervals',minutes:8,source:'5-5-zeros-of-polynomial-functions',lead:'The zeros split the number line into intervals. Test each interval to find where a quadratic is positive or negative.',rule:'Find zeros → test intervals → include endpoints if allowed',points:['First write the inequality with zero on one side.','Factor to find the critical values, then choose a test value in every interval.','Include roots for ≤ or ≥; exclude them for < or >.'],example:{q:'Solve x² − 5x + 6 < 0.',steps:['Factor: (x − 2)(x − 3) < 0. The critical values are 2 and 3.','Below 2 both factors are negative, giving a positive product. Between 2 and 3 their signs differ.','Above 3 both factors are positive. Only the middle interval gives a negative product.'],answer:'2 < x < 3'},watch:'A quadratic inequality can have two separate solution intervals. Do not assume the answer is always between the roots.',cards:[['How do roots help solve a quadratic inequality?','They divide the number line into intervals where the expression keeps the same sign.'],['When are zeros included in a quadratic inequality’s solution?','With ≤ or ≥, if the expression is defined at the zero.']],questions:[{q:'Solve (x − 1)(x − 4) < 0.',choices:['x < 1','x > 4','1 < x < 4','x < 1 or x > 4'],answer:2,why:'The factors have opposite signs only between 1 and 4.'},{q:'Solve x² − 9 ≥ 0.',choices:['−3 ≤ x ≤ 3','x ≤ −3 or x ≥ 3','x < −3 or x > 3','x ≥ 0'],answer:1,why:'The upward parabola is nonnegative outside the roots, including x = −3 and 3.'}]},
  {title:'Inequalities in two variables',minutes:7,source:'11-3-systems-of-nonlinear-equations-and-inequalities-two-variables',lead:'A two-variable inequality describes a region. Draw the boundary, then use a test point to decide which side belongs.',rule:'Solid boundary for ≤ or ≥; dashed for < or >',points:['Graph the equation obtained by replacing the inequality with an equals sign.','A strict inequality excludes its boundary; a non-strict one includes it.','For a system, keep only the overlap of all the solution regions.'],example:{q:'Describe the solution region of y ≥ x² − 1.',steps:['Draw the boundary parabola y = x² − 1, with vertex (0, −1).','Use a solid boundary because equality is included.','Test (0, 0): 0 ≥ −1 is true, so shade the side above the parabola.'],answer:'On or above y = x² − 1'},watch:'“Above” and “below” apply directly only after y is isolated. Otherwise use a test point.',cards:[['Which boundary style represents y < 2x + 1?','A dashed line, because equality is excluded.'],['What region solves a system of inequalities?','The overlap: points that satisfy every inequality at once.']],questions:[{q:'Does (0, 0) satisfy y > x + 1?',choices:['Yes','No','Only on the boundary','Cannot tell'],answer:1,why:'Substitute the point: 0 > 1 is false.'},{q:'What boundary is used for y ≤ x²?',choices:['Dashed parabola','Solid parabola','Dashed line','Solid line'],answer:1,why:'The boundary is the parabola y = x², and ≤ includes equality.'}]}
 ]}
];

function testsHTML(){const t=state.test;if(!t)return `${pageHeader('See what you can do.','A practice run, with room to get things wrong.')}<div class="session-start"><div class="session-form"><h2>Put the ideas to work.</h2><p>Choose a topic for six questions, or mix all topics for twelve. Answers and explanations appear after you finish.</p>${topicSelect('test-topic',state.topic)}${button('Start practice test'+ICON.arrow,'test-begin','','primary')}<p class="small">No time limit. Original revision questions, not an official exam.</p></div><div class="test-preview"><div class="preview-equation">x² − 7x + 12 = 0</div><p>A score tells you where you are.<br>The explanation helps you move on.</p><div class="test-facts"><span>Choose your answer</span><span>Check every step</span><span>Retry what you missed</span></div></div></div><section class="history"><h2>Your recent practice</h2>${study().scores.length?study().scores.slice().reverse().slice(0,6).map(s=>`<div class="history-row"><span><strong>${esc(s.topic)}</strong><small>${dateLabel(s.at)}</small></span><span>${s.correct} / ${s.total}<small>${Math.round(s.correct/s.total*100)}%</small></span></div>`).join(''):'<p>Your finished tests will appear here. Your first one is a starting point.</p>'}</section>`;

function testResults(t){const g=StudyCore.grade(t.questions,t.answers),missed=t.questions.filter(q=>t.answers[q.id]!==q.answer);return `${pageHeader('Here’s how it went.',t.label)}<div class="results-summary"><div><div class="result-score">${g.correct}<span> / ${g.total}</span></div><p>${g.percent}% correct${g.unanswered?' · '+g.unanswered+' unanswered':''}</p></div><div><h2>${g.correct===g.total?'You’ve got this set.':'The next step is in the details.'}</h2><p>${g.correct===g.total?'Try another topic or come back later to check what stuck.':'Read the explanations below. A missed question is a useful place to return to.'}</p><div class="actions">${missed.length?button('Retry missed questions','test-retry','','primary'):''}${button('Choose another test','test-reset','','secondary')}</div></div></div><section class="answer-review"><h2>Answers, with the reasoning</h2>${t.questions.map((q,i)=>{const a=t.answers[q.id],correct=a===q.answer;return `<article class="review-row"><div class="review-heading"><span class="result-state ${correct?'correct':'incorrect'}">${correct?ICON.check:ICON.x}${correct?'Correct':a==null?'Not answered':'Review this'}</span><span>Question ${i+1}</span></div><h3>${esc(q.q)}</h3><p>Your answer: <strong>${a==null?'Not answered':esc(q.choices[a])}</strong></p>${correct?'':`<p>Correct answer: <strong>${esc(q.choices[q.answer])}</strong></p>`}<p class="explanation">${esc(q.why)}</p><a href="#/lesson/${q.lesson}" class="text-link">Revisit the lesson${ICON.arrow}</a></article>`}).join('')}</section>`;}

uestions are authored study material. The full readings link to OpenStax; teacher handouts link to Mr. Crawford’s website. External resources need internet and use their own privacy policies.</p>${link('OpenStax textbook',BOOK+'preface')}${link('Teacher’s handouts','https://mrbcrawford.weebly.com/pre-calc-11-handouts.html')}<p class="small">Instrument Sans and Instrument Serif by Rodrigo Fuenzalida, distributed under the SIL Open Font License. Fonts are embedded for offline use. No analytics, remote fonts, or automatic uploads.</p></div></div><div class="settings-row danger-zone"><div><h2>Clear this browser’s desk</h2><p>Your original computer files are unaffected.</p></div><div class="settings-body"><p>Permanently remove subjects, stored file copies, project links, and study progress from this browser.</p>${button('Erase StudyDesk data','erase','','danger')}</div></div>`;}

function render(){renderNav();const v=state.route.view;$('#view').innerHTML=({home:homeHTML,lessons:lessonsHTML,topic:topicHTML,lesson:lessonHTML,flashcards:flashHTML,tests:testsHTML,resources:resourcesHTML,schoolwork:schoolworkHTML,subject:subjectHTML,settings:settingsHTML,search:searchHTML}[v]||homeHTML)();$('#mobile-title').textContent=({home:'Study home',lessons:'Lessons',topic:'Lessons',lesson:'Lesson',flashcards:'Flashcards',tests:'Practice tests',schoolwork:'Schoolwork',subject:'Schoolwork',settings:'Settings',resources:'Handouts',search:'Search'})[v];bindView();}
function renderView(){const focus=document.activeElement?.id;render();if(focus)document.getElementById(focus)?.focus({preventScroll:true});}
function bindView(){
  $('#flash-topic')?.addEventListener('change',e=>state.topic=e.target.value);
  $('#test-topic')?.addEventListener('change',e=>state.topic=e.target.value);
  $('#resource-topic')?.addEventListener('change',e=>{state.resourceTopic=e.target.value;renderView();});
  $('#resource-filter')?.addEventListener('change',e=>{state.resourceFilter=e.target.value;renderView();});
  $('#theme-select')?.addEventListener('change',async e=>{state.settings.theme=e.target.value;applyTheme();try{await saveSettings()}catch(e){showError(e)}});
  $('#file-input')?.addEventListener('change',async e=>{await importFiles([...e.target.files],state.route.id);e.target.value='';});
  $('#backup-input')?.addEventListener('change',async e=>{if(e.target.files[0])await restoreBackup(e.target.files[0]);e.target.value='';});
  const z=$('#dropzone');if(z){z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag-over');});z.addEventListener('dragleave',()=>z.classList.remove('drag-over'));z.addEventListener('drop',async e=>{e.preventDefault();z.classList.remove('drag-over');await importFiles([...e.dataTransfer.files],state.route.id);});}
  $$('.answer-option input').forEach(el=>el.addEventListener('change',()=>{state.test.answers[state.test.questions[state.test.index].id]=Number(el.value);$$('.answer-option').forEach(x=>x.classList.toggle('selected',x.contains(el)));$('.test-topline span:last-child').textContent=Object.keys(state.test.answers).length+' answered';$('.test-workspace progress').value=Object.keys(state.test.answers).length;$$('.question-number')[state.test.index].classList.add('answered');}));
}
async function startFlash(topic){state.topic=String(topic);state.flash={queue:StudyCore.shuffle(CARDS.filter(c=>topic==='all'||c.topic===Number(topic))).map(c=>c.id),flipped:false,remembered:0};if(state.route.view!=='flashcards')go('flashcards');else render();}
function startTest(topic,questions){state.topic=String(topic);state.test={questions:questions||StudyCore.shuffle(QUESTIONS.filter(q=>topic==='all'||q.topic===Number(topic))).slice(0,topic==='all'?12:6),answers:{},index:0,label:topic==='all'?'Mixed topics':topicBy(topic)?.title||'Missed questions',topic:String(topic),result:false};if(state.route.view!=='tests')go('tests');else render();}
async function action(name,value){switch(name){
 case 'navigate':go(value);break;
 case 'subject-new':subjectModal();break;
 case 'subject-edit':subjectModal(subjectBy(value));break;
 case 'lesson-complete':{const p=study();p.done=p.done.includes(value)?p.done.filter(x=>x!==value):[...p.done,value];await saveSettings();renderView();toast(p.done.includes(value)?'Lesson marked complete.':'Lesson marked unfinished.');break;}
 case 'flash-begin':startFlash($('#flash-topic').value);break;
 case 'flash-start':startFlash(String(value));break;
 case 'flash-flip':if(state.flash?.queue.length){state.flash.flipped=!state.flash.flipped;render();$('#flashcard')?.focus({preventScroll:true});}break;
 case 'flash-rate':{const f=state.flash;if(!f?.flipped)return;const id=f.queue.shift(),p=study();if(!p.reviewed.includes(id))p.reviewed.push(id);if(value==='known'){if(!p.known.includes(id))p.known.push(id);f.remembered++;}else{p.known=p.known.filter(x=>x!==id);f.queue.push(id);}f.flipped=false;await saveSettings();render();$('#flashcard')?.focus({preventScroll:true});break;}
 case 'flash-exit':state.flash=null;render();$('#page-title')?.focus();break;
 case 'test-begin':startTest($('#test-topic').value);break;
 case 'test-start':startTest(String(value));break;
 case 'test-prev':state.test.index=Math.max(0,state.test.index-1);render();$('.question legend')?.scrollIntoView({block:'nearest'});break;
 case 'test-next':state.test.index=Math.min(state.test.questions.length-1,state.test.index+1);render();$('.question legend')?.scrollIntoView({block:'nearest'});break;
 case 'test-jump':state.test.index=Number(value);render();break;
 case 'test-submit':{const t=state.test,g=StudyCore.grade(t.questions,t.answers);if(g.unanswered&&!await confirmAction('Finish with unanswered questions?',`${g.unanswered} question${g.unanswered===1?' is':'s are'} unanswered. They will count as incorrect. You can go back to finish them first.`,'Finish test'))return;t.result=true;study().scores.push({at:Date.now(),topic:t.label,correct:g.correct,total:g.total});study().scores=study().scores.slice(-30);await saveSettings();render();$('#page-title')?.focus();window.scrollTo(0,0);break;}
 case 'test-exit':if(await confirmAction('Leave this practice test?','Current answers will be discarded. Finished test history stays saved.','Leave test')){state.test=null;render();}break;
 case 'test-reset':state.test=null;render();break;
 case 'test-retry':{const t=state.test;startTest(t.topic,t.questions.filter(q=>t.answers[q.id]!==q.answer));break;}
 case 'bookmark':{const p=study();p.favorites=p.favorites.includes(value)?p.favorites.filter(x=>x!==value):[...p.favorites,value];await saveSettings();renderView();break;}
 case 'files-add':$('#file-input').click();break;
 case 'preview':await previewDoc(state.docs.find(d=>d.id===value));break;
 case 'download':{const d=state.docs.find(d=>d.id===value);if(d)download(d.blob,d.name);break;}
 case 'document-menu':documentMenu(state.docs.find(d=>d.id===value));break;
 case 'ai-edit':{const [id,k]=value.split('|');aiModal(subjectBy(id),k);break;}
 case 'ai-remove':{const [id,k]=value.split('|'),s=subjectBy(id);delete s.ai[k];await saveSubject(s);renderView();toast('Project link removed.');break;}
 case 'backup-export':await exportBackup();break;
 case 'backup-restore':$('#backup-input').click();break;
 case 'erase':if(await confirmAction('Erase this browser’s StudyDesk data?','This removes all subjects, stored documents, project links, and study progress from this browser. Export a backup first if you want to keep them. Original computer files are unaffected.','Erase data')){if(db)await transaction(['subjects','documents','settings'],tx=>['subjects','documents','settings'].forEach(s=>tx.objectStore(s).clear()));state.subjects=[];state.docs=[];state.settings=normalizeSettings(null);state.flash=null;state.test=null;applyTheme();go('home');toast('This browser’s StudyDesk data was erased.');}break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.closest('dialog'))Promise.resolve(action(b.dataset.action,b.dataset.value)).catch(showError);});
function field(label,id,value='',type='text',required=true,max=80){return `<label for="${id}">${esc(label)}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="${max}">`;}
async function saveSubject(s){if(db)await transaction(['subjects'],tx=>tx.objectStore('subjects').put(s));const i=state.subjects.findIndex(x=>x.id===s.id);if(i<0)state.subjects.push(s);else state.subjects[i]=s;state.subjects.sort((a,b)=>a.name.localeCompare(b.name));}
function subjectModal(s){const d=dialog(s?'Edit subject':'A place for a class',`<form id="subject-form">${field('Subject name','subject-name',s?.name||'')}<div class="actions"><button class="btn primary" type="submit">${s?'Save subject':'Create subject'}</button></div></form>${s?'<div class="dialog-danger"><button class="btn danger" id="delete-subject">Delete subject and its stored files</button></div>':''}`);d.querySelector('#subject-name').focus();d.querySelector('form').onsubmit=async e=>{e.preventDefault();const name=d.querySelector('#subject-name').value.trim();if(!name)return;try{const next={...(s||{id:uid(),createdAt:Date.now(),ai:{}}),name};await saveSubject(next);d.close();go('subject',next.id);toast(s?'Subject updated.':'Subject created.');}catch(e){showError(e)}};if(s)d.querySelector('#delete-subject').onclick=async()=>{d.close();if(!await confirmAction('Delete this subject?',`Delete “${s.name}” and its stored document copies? Your original computer files are unaffected.`,'Delete subject'))return;try{if(db)await transaction(['subjects','documents'],tx=>{tx.objectStore('subjects').delete(s.id);state.docs.filter(x=>x.subjectId===s.id).forEach(x=>tx.objectStore('documents').delete(x.id));});state.subjects=state.subjects.filter(x=>x.id!==s.id);state.docs=state.docs.filter(x=>x.subjectId!==s.id);go('schoolwork');toast('Subject and its stored file copies deleted.');}catch(e){showError(e)}};}
